<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE LAST DOOR - Psychological Horror</title>
  <meta name="description" content="A browser-based 3D psychological horror game - The Last Door using Three.js.">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN fallback or module import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Header Banner -->
    <header id="mode-header">
      <div class="logo">THE LAST DOOR <span>// PSYCHOLOGICAL HORROR</span></div>
      <div class="click-prompt">Click screen to focus controls</div>
    </header>

    <!-- PLAY MODE HUD -->
    <div id="hud-play" class="hud-layer">
      <div id="crosshair"></div>
      
      <!-- Interaction Prompt -->
      <div id="interaction-prompt" class="interaction-prompt" style="display: none;">[E] Enter Dreamcore</div>

      <div id="stamina-container">
        <div class="stamina-label">STAMINA</div>
        <div class="stamina-bar">
          <div id="stamina-fill"></div>
        </div>
      </div>

      <div id="flashlight-container">
        <span class="flashlight-label">FLASHLIGHT</span>
        <span id="flashlight-status" class="status-on">ON</span>
      </div>

      <div id="controls-hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
        <span><kbd>Shift</kbd> Sprint</span>
        <span><kbd>Ctrl</kbd> Crouch</span>
        <span><kbd>F</kbd> Flashlight</span>
        <span><kbd>E</kbd> Interact</span>
        <span><kbd>Mouse</kbd> Look</span>
      </div>
    </div>

    <!-- Fade Transition Overlay -->
    <div id="fade-overlay" class="fade-overlay"></div>

    <!-- EXIT REACHED MODAL OVERLAY -->
    <div id="exit-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h1 class="glitch-text">YOU FOUND THE EXIT</h1>
        <p>You navigated the endless corridors and unlocked The Last Door.</p>
        <div class="modal-actions">
          <button id="btn-exit-restart" class="modal-btn primary">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
